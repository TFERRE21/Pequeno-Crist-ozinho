<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 1240 1754"><rect width="1240" height="1754" fill="#fff"/><circle cx="80" cy="80" r="120" fill="#E8F7FF"/><circle cx="1170" cy="80" r="100" fill="#FFF8E9"/><rect x="28" y="28" width="1184" height="1698" rx="30" fill="none" stroke="#62B8EC" stroke-width="5"/><text x="70" y="80" font-size="18" font-weight="bold" fill="#F16F69">ATIVIDADE 10 • BÍBLIA</text><text x="70" y="140" font-size="38" font-weight="bold" fill="#24447E">GUIA DO ADULTO: RESPOSTAS</text><text x="70" y="190" font-size="22" fill="#283653">Use as respostas para conversar, não apenas corrigir.</text><rect x="130" y="270" width="980" height="570" rx="22" fill="#fff" stroke="#DCE7F5" stroke-width="3"/><text x="170" y="320" font-size="24" font-weight="bold" fill="#F16F69">RESPOSTAS SUGERIDAS</text><text x="170" y="380" font-size="21" fill="#283653">1. Criação: terra. Deus criou o mundo.</text><text x="170" y="435" font-size="21" fill="#283653">2. Noé: confiar em Deus e obedecer.</text><text x="170" y="490" font-size="21" fill="#283653">3. Davi: confiou em Deus.</text><text x="170" y="545" font-size="21" fill="#283653">4. Jesus: amor, acolhimento e cuidado.</text><text x="170" y="600" font-size="21" fill="#283653">5. Bom samaritano: ajudar o próximo.</text><text x="170" y="655" font-size="21" fill="#283653">6. Jonas: foi enviado a Nínive.</text><text x="170" y="710" font-size="21" fill="#283653">7. Ovelha perdida: cuidar de quem precisa.</text><text x="170" y="765" font-size="21" fill="#283653">8. Gratidão: respostas pessoais da criança.</text><text x="60" y="1685" font-size="16" font-weight="bold" fill="#24447E">PEQUENO CRISTÃOZINHO</text><text x="1180" y="1685" font-size="16" font-weight="bold" text-anchor="end" fill="#24447E">12</text></svg>